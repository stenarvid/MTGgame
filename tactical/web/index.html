<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commander Spire · Tactical</title>
<style>
:root{color-scheme:dark;--bg:#0e1420;--panel:#182335;--line:#344257;--gold:#f2cc83;--muted:#a9b5c9;--ink:#edf2fb;--green:#86dec1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#273144,var(--bg) 70%);color:var(--ink);font:15px system-ui,sans-serif;min-height:100vh}header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font:30px Georgia,serif;margin:0;color:var(--gold)}h2{font:25px Georgia,serif;color:var(--gold)}h3{margin:8px 0}p{line-height:1.5}.muted{color:var(--muted)}main{max-width:1600px;margin:auto;padding:22px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 13px;background:#25344a;color:var(--ink)}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--gold);background:#35445a}button:disabled{opacity:.4;cursor:default}button.primary{background:#356356;border-color:var(--green)}button.selected{outline:2px solid var(--gold)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:#182335e8;border:1px solid var(--line);padding:18px;border-radius:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.card{position:relative;min-height:155px;text-align:left;display:flex;flex-direction:column;gap:7px;border-top:4px solid var(--accent,#9ca6bc);background:linear-gradient(150deg,#28364a,#151e2c);padding:12px;border-radius:9px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.illustration{width:100%;height:76px;object-fit:cover;border-radius:5px;opacity:.85}.board .illustration{height:50px}.card strong{font:17px Georgia,serif}.card small{color:#c3cddd;line-height:1.4}.card .stats{margin-top:auto;font-weight:700;color:var(--gold)}.card.tapped{opacity:.65;transform:rotate(-2deg)}.card.target{outline:2px solid var(--green);cursor:pointer}.W{--accent:#f0e7c7}.U{--accent:#69bafa}.B{--accent:#b798d3}.R{--accent:#ff8d79}.G{--accent:#8ed59a}.C{--accent:#aab2c8}.mana{display:inline-block;border:1px solid var(--accent);border-radius:20px;padding:3px 8px;margin-right:5px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.player{border-top:3px solid var(--line)}.player.active{border-top-color:var(--gold)}.player.priority{box-shadow:0 0 0 2px var(--green)}.player.dead{opacity:.55}.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}.board .card{min-height:135px}.tag{border:1px solid #55705f;border-radius:5px;padding:2px 5px;color:#a9e6cf;display:inline-block;margin:1px;font-size:11px}.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.sticky{position:sticky;top:12px;align-self:start}.stackitem{padding:10px;border:1px solid var(--line);margin-top:7px;border-radius:6px}.notice{background:#2b433e;border:1px solid #5d9281;border-radius:8px;padding:12px;margin-bottom:14px}#error{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#703e40;padding:14px 25px;border-radius:9px;z-index:10;max-width:90%;display:none}.log{max-height:260px;overflow:auto;font-size:12px;line-height:1.7}.welcome{max-width:880px;margin:35px auto}.label{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}details{margin-top:12px}summary{cursor:pointer}.hand{margin-top:16px}.smallbtn{padding:4px 7px;font-size:12px}footer{color:var(--muted);font-size:12px;padding:15px 26px} @media(max-width:850px){.split{grid-template-columns:1fr}.sticky{position:static}.players{grid-template-columns:1fr}header{padding:15px}main{padding:12px}}
.picker-steps{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}.picker-steps span{padding:10px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}.picker-steps [aria-current=step]{border-color:var(--gold);color:var(--gold);background:#34352d}.commander-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.commander-option{border-top:4px solid var(--accent);padding:26px;display:flex;flex-direction:column;min-height:260px}.commander-option h3{font:27px Georgia,serif}.commander-option button{margin-top:auto}.package-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.package-option{padding:24px}.package-option.chosen{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.chosen-commander,.picker-confirm{display:flex;align-items:center;justify-content:space-between;gap:20px}.picker-confirm{border-color:var(--gold)}#pickerTitle:focus{outline:none}@media(max-width:700px){.commander-options,.package-options{grid-template-columns:1fr}.chosen-commander,.picker-confirm{align-items:stretch;flex-direction:column}.commander-option{min-height:200px}}
</style><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/temple-game.css"><link rel="stylesheet" href="/priority-ui.css"><link rel="stylesheet" href="/qol.css"><link rel="stylesheet" href="/spell-fx.css"><link rel="stylesheet" href="/battle-presentation.css?v=animation-4"></head><body class="game-shell">
<header><h1>Commander Spire</h1><span class="label">The commander chronicles</span><span id="connection" class="muted"></span><button id="homeButton">Rooms</button><details class="fx-settings"><summary>Effects</summary><label><input type="checkbox" checked onchange="SpireFX.configure({sound:this.checked})"> Sound</label><label>Volume <input type="range" min="0" max="1" step=".05" value=".3" oninput="SpireFX.configure({volume:Number(this.value)})"></label><label><input id="fx-reduced" type="checkbox" onchange="SpireFX.configure({reduced:this.checked})"> Reduced motion</label></details></header>
<main id="app"></main><div id="error" role="alert"></div><footer>Private hands · Public relics · Shared rules for humans and AI · Autosaved on this host</footer>
<script src="/cards.js"></script><script src="/inventory.js"></script><script src="/item-ui.js"></script><script src="/temple-game.js"></script><script src="/priority-ui.js"></script><script src="/spell-fx.js"></script><script src="/battle-presentation.js?v=animation-4"></script><script src="/card-hover.js"></script><script src="/qol.js"></script>
<script>
'use strict';
const app=document.querySelector('#app'),connection=document.querySelector('#connection');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let credentials=JSON.parse(sessionStorage.getItem('tactical-seat')||'null'),state=null,signature='',busy=false,home=false,selected=null,swap=null;
let attackChoices={},blockChoices={};
let commanderDraft=null, pollSerial=0, appliedPoll=0, roomEpoch=0;
const inspectionCards=new Map();
installCardHover(app,{shouldShow:card=>!selected&&!combatSelection&&!card?.dataset.reason});

function inspectArtwork(key){
    let c=inspectionCards.get(key);
    if(key.startsWith('commander_')){const cmd=commander(key.slice(10)),index=c?.owner!==undefined?state.battle?.players[c.owner]?.package:null,packages=Number.isInteger(index)?[cmd.packages[index]]:cmd.packages;c={...(c||cmd),name:cmd.name,text:packages.map(p=>p.name+': '+p.description).join(' / ')};}
    if(!c&&key.startsWith('relic_'))c=relic(key.slice(6));
    if(!c)return;
    let dialog=document.querySelector('#artInspector');
    if(!dialog){dialog=document.createElement('dialog');dialog.id='artInspector';document.body.append(dialog);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()})}
    dialog.innerHTML=`<div class="inspector-top"><h2>${esc(c.name)}</h2><button id="closeInspector" autofocus>Close</button></div><div class="inspector-body">${c.cost!==undefined?cardHTML(c):`<img alt="${esc(c.name)} illustration" src="/art/${esc(key)}?v=anime-2">`}<div><div class="label">${esc(c.kind|| (key.startsWith('relic_')?'Relic':'Commander'))}</div>${c.cost!==undefined?'<p><b>Mana cost: '+manaCost(c)+'</b></p>':''}<p>${esc(c.text)}</p>${(c.keywords||[]).map(k=>`<p><b>${esc(k)}</b>: ${esc((k==='Ward'&&c.ward_payments?.length?keywordHint(c,k):null)||state.battle?.keywords[k]||({Haste:'May attack and exhaust immediately.',Guard:'Attacking does not exhaust.',Flying:'Only Flying or Reach creatures can block.',Reach:'Can block Flying.',Trample:'Excess damage reaches the defender.',Lifesteal:'Damage dealt also heals you.',Ward:'Opposing targeting costs one extra generic mana.',Goad:'Must attack another opponent if able.'}[k]))}</p>`).join('')}${c.kind==='creature'?`<p><b>${c.attack} attack / ${c.health} maximum health</b></p>`:''}</div></div>`;
    dialog.querySelectorAll('.art-inspect').forEach(x=>x.remove());
    document.querySelector('#closeInspector').onclick=()=>dialog.close();
    if(!dialog.open)dialog.showModal();
}

function commanderPicker(){
    const m=state.me,key='tactical-picker:'+credentials.code+':'+m.id;
    const offerKey=m.offers.join(',');
    if(!commanderDraft||commanderDraft.key!==key||commanderDraft.offers!==offerKey){
        const saved=JSON.parse(sessionStorage.getItem(key)||'null');
        commanderDraft=saved?.offers===offerKey?saved:{key,offers:offerKey,commander:null,package:null};
    }
    if(m.commander){
        const c=commander(m.commander),p=c.packages[m.package];
        return `<h2>Commander confirmed</h2><div class="panel"><h3>${esc(c.name)}</h3><p>${c.colors.map(k=>colors[k]).join(' / ')} · ${esc(p.name)}</p><p>${esc(p.description)}</p><div class="notice">Waiting for the other players to finish their choices. You selected one commander and one package.</div></div>`;
    }
    const chosen=commanderDraft.commander&&m.offers.includes(commanderDraft.commander)?commander(commanderDraft.commander):null;
    const steps=`<nav class="picker-steps" aria-label="Commander selection"><span ${!chosen?'aria-current="step"':''}>1. Choose one commander</span><span ${chosen?'aria-current="step"':''}>2. Choose one package</span></nav>`;
    if(!chosen){
        return `${steps}<h2 id="pickerTitle" tabindex="-1">Step 1: choose ONE commander</h2><p class="muted">These are three alternatives. Select one, then choose its ability package on the next screen. Nothing is locked in yet.</p><div class="commander-options">${m.offers.map(id=>{const c=commander(id);return `<section class="panel commander-option ${c.colors[0]}"><img class="commander-portrait" role="button" tabindex="0" data-action="inspect:commander_${esc(c.id)}" alt="${esc(c.name)} portrait" src="/art/commander_${esc(c.id)}"><div class="commander-copy"><div class="label">Commander</div><h3>${esc(c.name)}</h3><p>${c.colors.map(k=>`<span class="mana ${k}">${colors[k]}</span>`).join(' ')}</p><p class="muted">${c.packages.map(p=>`<span class="package-teaser"><strong>${esc(p.name)}</strong>${esc(p.description)}</span>`).join('')}</p>${button('Choose this commander','pickCommander:'+id,false,'primary')}</div></section>`}).join('')}</div>`;
    }
    const packageChoice=Number.isInteger(commanderDraft.package)?chosen.packages[commanderDraft.package]:null;
    return `${steps}<h2 id="pickerTitle" tabindex="-1">Step 2: choose ONE package</h2><section class="panel chosen-commander"><img class="selected-portrait" alt="${esc(chosen.name)} portrait" src="/art/commander_${esc(chosen.id)}"><div><div class="label">Your selected commander</div><h3>${esc(chosen.name)}</h3><p>${chosen.colors.map(k=>colors[k]).join(' / ')} · These colors stay the same with either package.</p></div>${button('Back: change commander','backCommander')}</section><p class="muted">Choose one of these two alternatives. Each package includes both the passive and active abilities described below.</p><div class="package-options">${chosen.packages.map((p,j)=>`<section class="panel package-option ${commanderDraft.package===j?'chosen':''}"><div class="label">Package ${j+1} · passive + active</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><button data-action="pickPackage:${j}" aria-pressed="${commanderDraft.package===j}" class="${commanderDraft.package===j?'selected':''}">${commanderDraft.package===j?'Selected package':'Select this package'}</button></section>`).join('')}</div><section class="panel picker-confirm"><div><div class="label">Review your choice</div><b>${esc(chosen.name)}</b><p>${packageChoice?esc(packageChoice.name):'Select one package above to continue.'}</p><small class="muted">Confirmation locks this commander and package for the ${state.mode==='solo'?'run':'competition'}.</small></div>${button('Confirm commander & package','confirmCommander',!packageChoice||busy,'primary')}</section>`;
}

function updateCommanderDraft(changes){
    Object.assign(commanderDraft,changes);
    sessionStorage.setItem(commanderDraft.key,JSON.stringify(commanderDraft));
    render();
    document.querySelector('#pickerTitle')?.focus();
}
const colors={W:'White',U:'Blue',B:'Black',R:'Red',G:'Green',C:'Neutral'};
function error(message){const box=document.querySelector('#error');box.textContent=message;box.style.display='block';setTimeout(()=>box.style.display='none',6000)}
async function request(path,body,auth=credentials){const response=await fetch(path,{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),...(auth?{Authorization:'Bearer '+auth.token}:{})},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
async function act(action,data={}){if(busy||!credentials)return false;if(!confirmSpending(action,data))return false;const auth=credentials,epoch=roomEpoch;document.querySelector('#error').style.display='none';busy=true;try{await request('/api/action',{code:auth.code,action,...data},auth);if(epoch!==roomEpoch||auth!==credentials)return false;if(action==='commander'&&commanderDraft){sessionStorage.removeItem(commanderDraft.key);commanderDraft=null}if(action==='attack')attackChoices={};if(action==='block')blockChoices={};if(action==='deck')swap=null;selected=null;combatSelection=null;signature='';await poll();return true}catch(e){if(epoch===roomEpoch)error(e.message);return false}finally{busy=false}}
function seat(c){roomEpoch++;appliedPoll=0;state=null;swap=null;SpireFX.clear();selected=null;combatSelection=null;attackChoices={};blockChoices={};templeHandExpanded=false;credentials=c;loadQolRoom();sessionStorage.setItem('tactical-seat',JSON.stringify(c));let list=JSON.parse(localStorage.getItem('tactical-rooms')||'[]');list=list.filter(x=>x.token!==c.token);list.unshift(c);localStorage.setItem('tactical-rooms',JSON.stringify(list.slice(0,12)));home=false;signature='';poll()}
function button(text,action,disabled=false,cls=''){return `<button ${disabled?'disabled':''} class="${cls}" data-action="${action}">${esc(text)}</button>`}
function welcome(){roomEpoch++;cancelTreasure();SpireFX.clear();selected=null;combatSelection=null;swap=null;signature='';document.body.classList.remove('temple-battle');document.querySelector('#error').style.display='none';home=true;connection.textContent='';const rooms=JSON.parse(localStorage.getItem('tactical-rooms')||'[]');app.innerHTML=`<div class="welcome"><section class="welcome-hero"><div class="label">Build a threat. Read the table. Hold your response.</div><h2>Two commanders. One victor.</h2><p class="muted">Choose a commander, draft your strategy, and contest powerful combinations. Play a four-act solo campaign or invite friends to a private group.</p></section><div class="panel name-panel"><label>Your name <input id="name" value="Player" maxlength="32"></label></div><div class="grid mode-grid"><div class="panel mode-panel"><div class="mode-step">Play on your own</div><h3>Solo campaign</h3><p>Three encounters and a boss per act. Four acts, one retry, and a build that adapts between battles.</p><label>Difficulty <select id="runDifficulty" onchange="document.querySelector('#modifierNodes').disabled=this.value!=='custom'"><option value="normal">Normal · 1–2 challenge nodes</option><option value="hard">Hard · 3–4 challenge nodes</option><option value="custom">Custom</option></select></label><label>Custom challenge nodes per act <input id="modifierNodes" disabled type="number" min="0" max="4" value="2" style="width:75px"></label><p>${button('Begin solo run','createSolo',false,'primary')}</p> ${button('Learn to play','createTutorial')}</div><div class="panel mode-panel"><div class="mode-step">Host your friends</div><h3>Human competition</h3><p>Pick and pass with your group. Score eliminations and survival; improve your deck between battles.</p><div class="row"><span>1v1 ? two seats</span><label>Point target <input id="target" type="number" min="1" max="50" value="5" style="width:75px"></label></div><p>${button('Create group','createHuman',false,'primary')}</p></div><div class="panel mode-panel"><div class="mode-step">Enter a room code</div><h3>Join friends</h3><p>Open this host’s address and enter their room code.</p><label>Room code <input id="code" placeholder="Enter code" maxlength="6"></label><p>${button('Join group','join')}</p></div></div>${rooms.length?`<div class="panel"><h3>Resume on this host</h3>${rooms.map((r,i)=>button(r.code,'resume:'+i)).join(' ')}</div>`:''}<details class="panel"><summary>Rules at a glance</summary><p>30-card deck, five-card hand, 25 health. Mana refreshes on your turn and grows to ten. Cards and responses share that mana. Creatures normally wait a turn to attack; blockers can defend immediately. Everyone gets priority before a pending action resolves.</p><p>The first cycle prevents elimination. Damage on creatures lasts until their controller’s turn. Relics are public and cannot be removed. Ready creatures can block; exhausted creatures cannot.</p></details></div>`}
function cardById(id){return state.cards.find(c=>c.id===id)}
function commander(id){return state.commanders.find(c=>c.id===id)}
function relic(id){return state.relics.find(c=>c.id===id)}
function manaCost(c){const count=Object.values(c.pips||{}).reduce((a,b)=>a+b,0),generic=Math.max(0,(c.cost||0)-count);return (generic||!count?manaPip('C',generic):'')+Object.entries(c.pips||{}).map(([k,n])=>Array.from({length:n},()=>manaPip(k)).join('')).join('')}


function journeyHTML(){
 const stages=[['commanders','Commander'],['draft','Draft'],['build','Build'],['battle','Battle'],['rewards','Rewards']];
 const current=state.stage==='build'&&state.reports?.length?'rewards':state.stage==='retry'?'build':state.stage;
 if(!stages.some(([key])=>key===current))return '';
 return '<ol class="journey-track" aria-label="Your journey">'+stages.map(([key,label],i)=>`<li ${key===current?'aria-current="step"':''}><span class="step-number">0${i+1}</span>${label}</li>`).join('')+'</ol>';
}
function canPay(cost,pips,me){
 return Object.entries(pips||{}).every(([k,n])=>(me.mana[k]||0)>=n)&&Object.values(me.mana).reduce((a,b)=>a+b,0)+(me.temporary||0)>=cost;
}
function castReason(c){
 const b=state.battle,me=b.players[state.me.seat];if(!c)return 'Card is no longer in your hand.';
 if(!me.alive||b.finished)return 'This battle has ended for your seat.';
 if(b.choice)return 'Complete the pending decision first.';
 if(b.phase==='opening')return 'Keep your opening hand and finish any bottom choices.';
 if(b.phase==='grow')return 'Choose your main-phase mana color first.';
 if(b.phase==='blocks')return 'Confirm your blockers before playing responses.';
 if(b.priority!==me.id)return 'Wait for your priority to play this card.';
 if(c.kind!=='creature'&&me.id===0&&b.encounter?.modifiers?.includes('creatures_only'))return 'Challenge: only creature spells.';
 if(c.kind!=='response'&&c.speed!=='Instant'&&!(c.keywords||[]).includes('Flash')&&!(c.kind==='creature'&&me.creature_flash)&&(b.active!==me.id||!['main','main2'].includes(b.phase)||b.stack.length))return 'Play during your main phase with no pending actions.';
 if(['destroy','bargain'].includes(c.effect)&&me.hp<=2)return 'Requires more than 2 health to pay the cost.';
 if(c.id==='r_loot'&&me.hand.length<2)return 'Requires another hand card to discard.';
 if(!canPay(c.cost,c.pips,me))return 'Not enough ready mana: '+c.cost+' total, including the shown colors.';
 if(c.target){const targets=b.targets[c.target]||[];if(!targets.length)return 'No legal target is available.';
 const affordable=targets.some(uid=>{const target=b.players.flatMap(p=>p.board).find(d=>d.uid===uid);const ward=target&&target.owner!==me.id&&(target.ward_cost??((target.keywords||[]).includes('Ward')?1:0));return canPay(c.cost+(ward?1:0),c.pips,me)});
 if(!affordable)return 'The target has Ward: one additional mana is required.';}
 return '';
}
function commanderReason(){const me=state.battle.players[state.me.seat],cmd=commander(me.commander);return castReason({id:'commander',kind:'creature',effect:'commander',cost:4+me.tax,pips:Object.fromEntries(cmd.colors.map(k=>[k,1]))})}
function handCard(c){
 const bottom=state.battle.phase==='opening'&&state.battle.players[state.me.seat].bottom_remaining>0,discard=state.battle.choice?.owner===state.me.seat&&['discard','optional_loot'].includes(state.battle.choice.kind),reason=(bottom||discard)?'':castReason(c),action=bottom?'bottom:'+c.uid:discard?(state.battle.choice.kind==='optional_loot'?'itemDiscard:':'discardChoice:')+c.uid:'cast:'+c.uid;
 let html=cardHTML(c,action,`<div class="action-hint">${esc(bottom?'Place on deck bottom':discard?'Choose to discard':reason||'Ready · '+(c.target?'choose a target':'cast this card'))}</div>`);
 return html.replace('class="card ',`aria-disabled="${!!reason}" data-unavailable="${esc(reason)}" class="card ${reason?'action-unavailable':'availability-ready'} `);
}
function decisionHelp(){
 const b=state.battle,me=b.players[state.me.seat];
 if(!me.alive)return 'Spectating: follow the public battlefield and pending actions.';
 if(selected)return 'Choose a highlighted target, or press Escape to cancel.';
 if(b.phase==='opening')return me.kept?'Finish any bottom choices, then wait for both players to keep.':'Keep five cards, or redraw. First mulligan free; later redraws require bottoming cards.';
 if(b.choice?.owner===me.id)return b.choice.kind==='trigger_order'?'Choose the resolution order of your own triggers.':['discard','optional_loot'].includes(b.choice.kind)?'Choose one card from your hand to discard.':['attachment_target','counter_target'].includes(b.choice.kind)?'Choose a target for the required trigger.':'Complete the required gameplay choice.';
 if(b.priority!==me.id)return 'Waiting for '+b.players[b.priority].name+'. Your hand stays available to inspect.';
 if(b.phase==='grow')return 'Choose a color to gain one permanent mana capacity.';
 if(b.stack.length)return 'Respond with a ready card or ability, or pass. The top action resolves after everyone passes.';
 if(b.phase==='combat')return 'Choose an opponent for each attacker, then confirm. Stay ready to hold a creature back.';
 if(b.phase==='blocks')return 'Assign ready creatures to attackers, then confirm. Multiple creatures can block together.';
 return 'Play a ready card, use a creature ability, or '+(b.phase==='main2'?'end your turn.':'continue to combat.');
}

function scoreboard(){return `<div class="row">${state.members.map(m=>`<span>${esc(m.name)}${m.bot?' · AI':''}${m.departed?' · left':''} <b>${m.score} VP</b> · ${m.losses} losses</span>`).join('<span class="muted"> / </span>')}</div>`}
function render(){if(!state||home)return;loadQolRoom();const ui=snapshotQol();document.body.classList.toggle('temple-battle',state.stage==='battle');if(app.dataset.stage&&app.dataset.stage!==state.stage)document.querySelector('#error').style.display='none';connection.textContent=`Room ${credentials.code} · ${state.mode==='solo'?'Solo':'Group'} · ${state.stage}`;const m=state.me;
let html=journeyHTML()+lessonHTML()+`<div class="room-tools">${button('Copy room code','copyRoom',false,'smallbtn')}</div>`;html+=state.save_error?`<div class="notice">${esc(state.save_error)}</div>`:'';if(m.bot)html+=`<div class="notice">AI temporarily controls your seat. ${button('Reclaim control','reclaim')}</div>`;
if(state.stage==='lobby'){html+=`<h2>Your play group</h2><div class="notice">Invite friends to this address with code <b>${credentials.code}</b>. Each browser has its own private seat.</div><div class="panel">${state.members.map(x=>`<p>${esc(x.name)} ${x.bot?'· AI rival':''}</p>`).join('')}<p>${state.members.filter(x=>!x.departed).length}/${state.size} seats</p>${state.mode==='human'&&state.members.filter(x=>!x.departed).length<2?button('Play against AI','add_bot',m.id!==state.host):''} ${button('Choose commanders','start',m.id!==state.host,'primary')}</div>`}
else if(state.stage==='commanders'){html+=commanderPicker()}
else if(state.stage==='draft'){const solo=state.mode==='solo',pack=solo?m.reward:state.pack;html+=`<h2>${solo?'Build your opening pool':'Pick and pass'}</h2><p class="stage-guidance">${solo?'Choose cards in your commander’s colors. Inspect a card to read its full rules before picking.':'Pick one card, then pass the pack. Off-color picks stay in reserve; only your identity can enter the deck.'}</p><p>${solo?`Pack ${m.solo_packs+1}/3 · keep ${m.reward_left} more`:`Pack ${state.draft_round}/3 · pick ${state.draft_pick}/15 · ${m.picked?'waiting for other picks':'choose one card'}`}</p><div class="cardgrid">${pack.map((id,j)=>cardHTML(cardById(id),m.picked||(solo&&!legal(id))?'':'pick:'+j,legal(id)?'<small>Fits your identity</small>':'<small>Outside your identity</small>')).join('')}</div>`}
else if(state.stage==='battle'){html+=battleHTML()}
else if(state.stage==='vote'){html+=`<h2>Target reached</h2><div class="panel">${scoreboard()}<p>${esc(state.vote_message)}</p>${state.vote_options.map(c=>button(c,'vote:'+c)).join(' ')}<p>${state.members.filter(x=>!x.departed).map(x=>esc(x.name)+': '+esc(state.votes[x.id]||'pending')).join(' · ')}</p>${button('Leave competition','leave')}</div>`}
else if(['build','retry'].includes(state.stage)){html+=buildHTML()}
else {let title={victory:'Campaign complete',defeat:'Run ended',complete:'Competition complete'}[state.stage]||state.stage;html+=treasureHTML()+`<h2>${title}</h2><div class="panel">${scoreboard()}<p>${esc(state.vote_message)}</p>${state.mode==='human'?`<p>Leaders: ${state.members.filter(m=>!m.departed&&m.score===Math.max(...state.members.filter(x=>!x.departed).map(x=>x.score))).map(m=>esc(m.name)).join(', ')}</p>`:''}<p>${button('Back to rooms','home')}</p></div>`}
app.innerHTML=html;decorateQol();restoreQol(ui);if(state.stage==='battle'){requestAnimationFrame(drawTempleArrows);updateResponseCountdown()};app.dataset.stage=state.stage;app.dataset.room=credentials.code;if(state.lesson&&lastLessonStep!==state.lesson.step){lastLessonStep=state.lesson.step;requestAnimationFrame(()=>document.querySelector('.tutorial-guide')?.scrollIntoView({behavior:SpireFX.settings.reduced?'auto':'smooth',block:'start'}))}for(const card of app.querySelectorAll('[data-action^="swapOut:"]'))card.classList.toggle('exchange-selected',card.dataset.action==='swapOut:'+swap);if(state.battle&&state.stage==='battle'){const card=selected&&state.battle.players.flatMap(p=>[...p.board,...p.hand,...(p.gear||[]),...(p.pouch||[])]).find(c=>c.uid===selected.uid);SpireFX.setTarget(card,selected)}else SpireFX.clear();
}
function legal(id){return commander(state.me.commander).colors.includes(cardById(id).color)||cardById(id).color==='C'}
function counts(list){const c={};for(const x of list)c[x]=(c[x]||0)+1;return c}
function buildHTML(){const m=state.me,deck=counts(m.deck),owned=counts(m.owned),reserve=Object.keys(owned).filter(id=>owned[id]> (deck[id]||0)&&legal(id));let html=mapHTML()+treasureHTML()+`<h2>${state.stage==='retry'?'One more chance':'Fine-tune your build'}</h2><div class="panel">${scoreboard()}<p>${esc(commander(m.commander).name)} · ${esc(commander(m.commander).packages[m.package].name)} · ${m.deck.length}/30 cards</p>${state.mode==='solo'?`<p>Act ${state.encounter.act} · ${state.encounter.kind} ${state.encounter.battle}/4 · ${esc(state.encounter.description)} · Currency ${state.currency} · Retries ${state.retry}</p><details><summary>Upcoming rivals</summary>${state.upcoming_loadout?`<p>Active Relics: ${state.upcoming_loadout.relics.map(r=>esc(r.name)+': '+esc(r.text)).join(' ? ')}</p><p>Pouch: ${state.upcoming_loadout.pouch.map(c=>esc(c.name)+': '+esc(c.text)).join(' ? ')}</p>`:''}${state.upcoming.map(x=>`<p>${esc(commander(x.commander).name)} · ${commander(x.commander).colors.join('/')} · ${esc(commander(x.commander).packages[x.package].description)}<br>Relic: ${esc(relic(x.relic).name)} · ${esc(relic(x.relic).text)}</p>`).join('')}</details>`:''}</div>`;
if(m.reward_left){html+=`<h3>Reward pack · keep ${m.reward_left} more</h3><div class="cardgrid">${m.reward.map((id,j)=>cardHTML(cardById(id),legal(id)?'pick:'+j:'',`<small>${cardOwnership(id)}${legal(id)?'':' ? Outside your identity'}</small>`)).join('')}</div>`}
if(state.mode==='solo'){html+=inventoryHTML()}
else if(m.relic_options.length){html+=`<h3>${m.relic?'Optional relic replacement':'Choose your relic'}</h3><div class="grid">${m.relic_options.map(id=>`<div class="panel relic-choice"><img class="relic-art" alt="${esc(relic(id).name)} illustration" src="/art/relic_${esc(id)}"><h3>${esc(relic(id).name)}</h3><p>${esc(relic(id).text)}</p>${button('Choose','relic:'+id)}</div>`).join('')}${m.relic?`<div class="panel relic-choice"><img class="relic-art" alt="${esc(relic(m.relic).name)} illustration" src="/art/relic_${esc(m.relic)}"><h3>${esc(relic(m.relic).name)}</h3><p>${esc(relic(m.relic).text)}</p>${button('Keep current relic','relic:'+m.relic)}</div>`:''}</div>`}
else if(m.relic){html+=`<p><img class="relic-thumb" alt="" src="/art/relic_${esc(m.relic)}">Relic: <b>${esc(relic(m.relic).name)}</b> · ${esc(relic(m.relic).text)}</p>`}
html+=`<div class="notice">${swap?'Choose a reserve card to replace '+esc(cardById(swap).name)+'.':'Click a deck card, then a reserve card to exchange it. Deck size stays 30.'} ${swap?button('Cancel exchange','cancelSwap'):''}</div>${curveHTML()}<h3>Deck</h3>${collectionTools('deck')}<div class="cardgrid" data-collection="deck">${Object.keys(deck).map(id=>cardHTML(cardById(id),m.ready?'':'swapOut:'+id,`<small>${deck[id]} copies${swap===id?' · Selected for exchange':''}</small>`)).join('')}</div><h3>Reserve</h3>${collectionTools('reserve')}<div class="cardgrid" data-collection="reserve">${reserve.map(id=>cardHTML(cardById(id),swap&&!exchangeReason(id)?'swapIn:'+id:'',`<small>${owned[id]-(deck[id]||0)} available${exchangeReason(id)?' \u00b7 '+esc(exchangeReason(id)):''}</small>`)).join('')||'<p class="muted">No legal reserve cards yet.</p>'}</div>`;
if(state.mode==='solo'&&state.stage==='build'&&state.shop.length){html+=`<h3>Shop · one currency per card or refresh</h3><div class="grid">${state.shop.map((id,j)=>cardHTML(cardById(id),'',`<small>${cardOwnership(id)}</small>`+button('Buy','buy:'+j,state.currency<1))).join('')}</div><p>${button('Refresh shop · 1','refresh',state.currency<1)}</p>`}
if(state.reports.length){const r=state.reports.at(-1);html+=`<details class="panel"><summary>Last battle · ${Math.round(r.seconds/60)} minutes</summary><p>Turns: ${r.turns.join(' / ')} · Spectator waits: ${r.spectator_seconds.map(s=>Math.round(s/60)+'m').join(' / ')}</p><label>What would you change next time?<input id="feedback" maxlength="500" value="${esc(state.feedback)}" style="width:100%;margin:10px 0"></label>${button('Save reflection','feedback')}</details>`;}html+=`<div class="panel row build-actions"><span class="build-status">${m.reward_left?`Choose ${m.reward_left} reward cards`:m.relic_options.length?(state.mode==='solo'?'Choose equipment to continue':'Choose a relic to continue'):state.tutorial&&state.lesson.step!=='boss_ready'?'Complete the training action above':swap?'Select a reserve card to complete your exchange':'30 cards · Build ready'}</span>${state.stage==='retry'?button('Use retry','retry',false,'primary')+' '+button('End run','end_run'):button(m.ready?'Waiting for group':'Begin next battle','ready',m.ready||!!m.reward_left||!!m.relic_options.length||(state.tutorial&&state.lesson.step!=='boss_ready'),'primary')}${state.mode==='human'?button('Leave competition','leave'):''}</div>`;return html;
}
function targetLabel(t){if(t.startsWith('p:'))return state.battle.players[Number(t.slice(2))].name;let stack=state.battle.stack.find(s=>s.uid===t);if(stack)return stack.name;for(const p of state.battle.players){for(const z of ['board','grave','engines','hand','gear']){const c=(p[z]||[]).find(c=>c.uid===t);if(c)return p.name+' · '+c.name}}return t}
function abilityKind(c){if(c.commander)return commander(state.me.commander).packages[state.me.package].active;return ['mana','sacrifice'].includes(c.effect)?c.effect:null}
function selectCast(uid){templeHandExpanded=false;combatSelection=null;const reason=uid==='commander'?commanderReason():castReason(state.battle.players[state.me.seat].hand.find(c=>c.uid===uid));if(reason){error(reason);return}const b=state.battle,me=b.players[state.me.seat];let c;if(uid==='commander'){const cmd=commander(state.me.commander);c={uid,name:cmd.name}}else c=me.hand.find(c=>c.uid===uid);if(!c)return;if(c.id==='r_loot'){templeHandExpanded=matchMedia('(max-width:850px)').matches;selected={uid,name:c.name,costChoice:true,targets:me.hand.filter(d=>d!==c).map(d=>d.uid),action:'cast',targetKind:c.target};render();return}if(c.target){selected={uid,name:c.name,targets:b.targets[c.target],action:'cast',targetKind:c.target};render()}else act('cast',{uid})}
function selectAbility(uid){combatSelection=null;const me=state.battle.players[state.me.seat],c=me.board.find(c=>c.uid===uid);if(!c)return;const reason=abilityReason(c);if(reason){showTip(reason,document.querySelector(`[data-uid="${CSS.escape(uid)}"]`));return}const effect=abilityKind(c),kind={damage:'any',buff:'friendly',protect:'friendly',bounce:'creature',recall:'grave'}[effect];if(kind){selected={uid,name:c.name,targets:state.battle.targets[kind],targetKind:kind,action:'ability'};render()}else if(effect==='sacrifice'||effect==='loot'){selected={uid,name:c.name,targets:effect==='sacrifice'?me.board.filter(d=>d!==c).map(d=>d.uid):me.hand.map(d=>d.uid),costChoice:true,action:'ability',costField:effect==='sacrifice'?'sacrifice':'discard'};render()}else act('ability',{uid})}
app.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;if(el.getAttribute('aria-disabled')==='true'&&!event.target.closest('.art-inspect')){error(el.dataset.unavailable||'This action is unavailable.');return}const key=el.dataset.action,[action,...rest]=key.split(':'),arg=rest.join(':');try{
if(action==='resetFilters'){delete qolPrefs[arg];saveQolPrefs();render();return}if(action==='treasure'){openTreasure(arg);return}if(action==='route'){act('route',{node:arg});return}if(action==='copyRoom'){try{await navigator.clipboard.writeText(credentials.code);el.textContent='Copied!'}catch{error('Copy unavailable. Select the displayed room code.')}return}if(handlePriorityAction(action,arg))return;if(handleBattleItems(action,arg))return;if(handleTempleCombat(action,arg))return;if(action==='templeHand'){templeHandExpanded=!templeHandExpanded;render();return}if(handleInventoryAction(action,arg))return;if(action==='focusOpponent'){focusedOpponent=Number(arg);render();return}if(action==='bottom'){act('bottom',{uid:arg});return}if(action==='inspect'){inspectArtwork(arg);return}if(action==='home'){welcome();return}if(action==='resume'){seat(JSON.parse(localStorage.getItem('tactical-rooms'))[Number(arg)]);return}
if(['createSolo','createTutorial','createHuman','join'].includes(action)){const name=document.querySelector('#name').value;const result=await request(action==='join'?'/api/join':'/api/create',action==='join'?{name,code:document.querySelector('#code').value}:{name,tutorial:action==='createTutorial',mode:action==='createHuman'?'human':'solo',size:2,difficulty:document.querySelector('#runDifficulty').value,modifier_nodes:Number(document.querySelector('#modifierNodes').value),target:Number(document.querySelector('#target').value)});seat(result);return}
if(action==='feedback'){act('feedback',{text:document.querySelector('#feedback').value});return}if(action==='pickCommander'){updateCommanderDraft({commander:arg,package:null});return}if(action==='backCommander'){updateCommanderDraft({commander:null,package:null});return}if(action==='pickPackage'){updateCommanderDraft({package:Number(arg)});return}if(action==='confirmCommander'){if(commanderDraft&&Number.isInteger(commanderDraft.package))act('commander',{commander:commanderDraft.commander,package:commanderDraft.package});return}if(action==='cmd'){act('commander',{commander:rest[0],package:Number(rest[1])});return}if(action==='pick'){act('pick',{index:Number(arg)});return}if(action==='relic'){act('relic',{relic:arg});return}if(action==='vote'){act('vote',{choice:arg});return}if(action==='color'){act('color',{color:arg});return}if(action==='buy'){act('buy',{index:Number(arg)});return}
if(action==='swapOut'){swap=arg;render();return}if(action==='cancelSwap'){swap=null;render();return}if(action==='swapIn'){const deck=[...state.me.deck];if(exchangeReason(arg)){error(exchangeReason(arg));return}const index=deck.indexOf(swap);if(index<0){error('Select a deck card first.');return}deck[index]=arg;act('deck',{deck});return}
if(action==='discardChoice'){act('choose_discard',{uid:arg});return}if(action==='loop'){const count=Number(prompt('How many repetitions? Each opponent still gets priority. You may stop at any time.','3'));if(count)act('loop',{uid:arg,count});return}if(action==='cast'){selectCast(arg);return}if(action==='ability'){selectAbility(arg);return}if(action==='cancel'){selected=null;combatSelection=null;render();return}if(action==='target'&&selected){if(selected.target!==arg){selected.target=arg;render();return}const s=selected;templeHandExpanded=false;if(s.explicit&&s.costChoice){s.costs[s.costField]=arg;s.pendingCosts.shift();advanceExplicitSelection(s)}else if(s.costChoice)act(s.action,{uid:s.uid,[s.costField||'discard']:arg});else act(s.action,{uid:s.uid,target:arg,...(s.explicit?{ability:s.ability,...s.costs}:{})});return}
if(action==='attack'){const attacks=Object.entries(attackChoices).filter(([uid,d])=>d!==null).map(([uid,defender])=>({uid,defender}));act('attack',{attacks});return}if(action==='block'){let blocks={};for(const [uid,a] of Object.entries(blockChoices)){if(a)(blocks[a]??=[]).push(uid)}act('block',{blocks});return}if(action==='order'){let order=[...state.battle.blocks[arg]];order.push(order.shift());act('order',{uid:arg,order});return}
if(action==='concede'&&!confirm('Concede this battle? No elimination point will be awarded.'))return;
act(action);
}catch(e){error(e.message)}});
app.addEventListener('change',event=>{if(event.target.dataset.attack)attackChoices[event.target.dataset.attack]=event.target.value===''?null:Number(event.target.value);if(event.target.dataset.block)blockChoices[event.target.dataset.block]=event.target.value;if(event.target.dataset.attack||event.target.dataset.block)render();if(event.target.id==='auto')act('auto',{enabled:event.target.checked})});
app.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.dataset.action){event.preventDefault();event.target.click()}if(event.key==='Escape'&&(selected||combatSelection)){selected=null;combatSelection=null;render()}});
document.querySelector('#homeButton').onclick=()=>{if(home&&credentials){home=false;signature='';poll()}else welcome()};
async function poll(){if(!credentials||home)return;const auth=credentials,epoch=roomEpoch,ticket=++pollSerial;try{SpireFX.capture(state?.battle);const next=await request('/api/state?code='+encodeURIComponent(auth.code),undefined,auth);if(epoch!==roomEpoch||home||auth!==credentials||ticket<appliedPoll)return;appliedPoll=ticket;const previous=state,sig=JSON.stringify({...next,timer:0,...(next.priority_flow?{priority_flow:{...next.priority_flow,server_now:0}}:{})});if(next.priority_flow)priorityClockOffset=Date.now()/1000-next.priority_flow.server_now;state=next;connection.textContent=`Room ${auth.code} · ${next.mode==='solo'?'Solo':'Group'} · ${next.stage}`;const timer=document.querySelector('#timer');if(timer)timer.textContent=state.untimed?'Your decision \u00b7 untimed':state.timer+'s \u00b7 bank '+state.me.time_bank+'s';if(sig!==signature){signature=sig;if(selected&&next.stage==='battle'){const me=next.battle.players[next.me.seat],source=[...me.hand,...me.board,...me.engines,...(me.gear||[]),...(me.pouch||[])].find(c=>c.uid===selected.uid);if(!source||next.battle.priority!==me.id||next.battle.choice)selected=null;else if(selected.targetKind){selected.targets=next.battle.targets[selected.targetKind]||[];if(!selected.targets.includes(selected.target))selected.target=null}}render();if(next.stage==='battle'){SpireFX.consume(next.battle,{initial:previous?.stage!=='battle'});SpireFX.presentState?.(previous?.stage==='battle'?previous.battle:null,next.battle)}else{SpireFX.clear();SpireFX.presentInventory?.(previous,next);if(previous?.stage==='battle')SpireFX.presentOutcome?.(next.stage,next.battle||previous.battle,next.me.seat)}}}catch(e){if(epoch!==roomEpoch||home||auth!==credentials||ticket<appliedPoll)return;connection.innerHTML='Connection interrupted · retrying <button>Retry</button>';connection.querySelector('button').onclick=()=>poll();if(!state)error(e.message)}}
loadQolRoom();document.querySelector('#fx-reduced').checked=SpireFX.settings.reduced;if(credentials)poll();else welcome();setInterval(poll,750);
matchMedia('(max-width:850px)').addEventListener('change',()=>{if(state&&!home)render()});
</script></body></html>
