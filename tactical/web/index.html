<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commander Spire · Tactical</title>
<style>
:root{color-scheme:dark;--bg:#0e1420;--panel:#182335;--line:#344257;--gold:#f2cc83;--muted:#a9b5c9;--ink:#edf2fb;--green:#86dec1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#273144,var(--bg) 70%);color:var(--ink);font:15px system-ui,sans-serif;min-height:100vh}header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font:30px Georgia,serif;margin:0;color:var(--gold)}h2{font:25px Georgia,serif;color:var(--gold)}h3{margin:8px 0}p{line-height:1.5}.muted{color:var(--muted)}main{max-width:1600px;margin:auto;padding:22px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 13px;background:#25344a;color:var(--ink)}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--gold);background:#35445a}button:disabled{opacity:.4;cursor:default}button.primary{background:#356356;border-color:var(--green)}button.selected{outline:2px solid var(--gold)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:#182335e8;border:1px solid var(--line);padding:18px;border-radius:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.card{position:relative;min-height:155px;text-align:left;display:flex;flex-direction:column;gap:7px;border-top:4px solid var(--accent,#9ca6bc);background:linear-gradient(150deg,#28364a,#151e2c);padding:12px;border-radius:9px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.illustration{width:100%;height:76px;object-fit:cover;border-radius:5px;opacity:.85}.board .illustration{height:50px}.card strong{font:17px Georgia,serif}.card small{color:#c3cddd;line-height:1.4}.card .stats{margin-top:auto;font-weight:700;color:var(--gold)}.card.tapped{opacity:.65;transform:rotate(-2deg)}.card.target{outline:2px solid var(--green);cursor:pointer}.W{--accent:#f0e7c7}.U{--accent:#69bafa}.B{--accent:#b798d3}.R{--accent:#ff8d79}.G{--accent:#8ed59a}.C{--accent:#aab2c8}.mana{display:inline-block;border:1px solid var(--accent);border-radius:20px;padding:3px 8px;margin-right:5px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.player{border-top:3px solid var(--line)}.player.active{border-top-color:var(--gold)}.player.priority{box-shadow:0 0 0 2px var(--green)}.player.dead{opacity:.55}.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}.board .card{min-height:135px}.tag{border:1px solid #55705f;border-radius:5px;padding:2px 5px;color:#a9e6cf;display:inline-block;margin:1px;font-size:11px}.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.sticky{position:sticky;top:12px;align-self:start}.stackitem{padding:10px;border:1px solid var(--line);margin-top:7px;border-radius:6px}.notice{background:#2b433e;border:1px solid #5d9281;border-radius:8px;padding:12px;margin-bottom:14px}#error{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#703e40;padding:14px 25px;border-radius:9px;z-index:10;max-width:90%;display:none}.log{max-height:260px;overflow:auto;font-size:12px;line-height:1.7}.welcome{max-width:880px;margin:35px auto}.label{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}details{margin-top:12px}summary{cursor:pointer}.hand{margin-top:16px}.smallbtn{padding:4px 7px;font-size:12px}footer{color:var(--muted);font-size:12px;padding:15px 26px} @media(max-width:850px){.split{grid-template-columns:1fr}.sticky{position:static}.players{grid-template-columns:1fr}header{padding:15px}main{padding:12px}}
.picker-steps{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}.picker-steps span{padding:10px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}.picker-steps [aria-current=step]{border-color:var(--gold);color:var(--gold);background:#34352d}.commander-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.commander-option{border-top:4px solid var(--accent);padding:26px;display:flex;flex-direction:column;min-height:260px}.commander-option h3{font:27px Georgia,serif}.commander-option button{margin-top:auto}.package-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.package-option{padding:24px}.package-option.chosen{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.chosen-commander,.picker-confirm{display:flex;align-items:center;justify-content:space-between;gap:20px}.picker-confirm{border-color:var(--gold)}#pickerTitle:focus{outline:none}@media(max-width:700px){.commander-options,.package-options{grid-template-columns:1fr}.chosen-commander,.picker-confirm{align-items:stretch;flex-direction:column}.commander-option{min-height:200px}}
</style><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/spell-fx.css"><link rel="stylesheet" href="/battle-presentation.css?v=animation-3"><link rel="stylesheet" href="/battle-presentation.css?v=animation-3"></head><body>
<header><h1>Commander Spire</h1><span class="label">Tactical prototype</span><span id="connection" class="muted"></span><button id="homeButton">Rooms</button><details class="fx-settings"><summary>Effects</summary><label><input type="checkbox" checked onchange="SpireFX.configure({sound:this.checked})"> Sound</label><label>Volume <input type="range" min="0" max="1" step=".05" value=".3" oninput="SpireFX.configure({volume:Number(this.value)})"></label><label><input id="fx-reduced" type="checkbox" onchange="SpireFX.configure({reduced:this.checked})"> Reduced motion</label></details></header>
<main id="app"></main><div id="error" role="alert"></div><footer>Private hands · Public relics · Shared rules for humans and AI · Autosaved on this host</footer>
<script src="/cards.js"></script><script src="/spell-fx.js"></script><script src="/battle-presentation.js?v=animation-3"></script><script src="/battle-presentation.js?v=animation-3"></script><script src="/card-hover.js"></script>
<script>
'use strict';
const app=document.querySelector('#app'),connection=document.querySelector('#connection');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let credentials=JSON.parse(sessionStorage.getItem('tactical-seat')||'null'),state=null,signature='',busy=false,home=false,selected=null,swap=null;
let attackChoices={},blockChoices={};
let commanderDraft=null;
const inspectionCards=new Map();
installCardHover(document.querySelector('#app'));

function inspectArtwork(key){
    let c=inspectionCards.get(key);
    if(key.startsWith('commander_')){const cmd=commander(key.slice(10)),index=c?.owner!==undefined?state.battle?.players[c.owner]?.package:null,packages=Number.isInteger(index)?[cmd.packages[index]]:cmd.packages;c={...(c||cmd),name:cmd.name,text:packages.map(p=>p.name+': '+p.description).join(' / ')};}
    if(!c&&key.startsWith('relic_'))c=relic(key.slice(6));
    if(!c)return;
    let dialog=document.querySelector('#artInspector');
    if(!dialog){dialog=document.createElement('dialog');dialog.id='artInspector';document.body.append(dialog);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()})}
    dialog.innerHTML=`<div class="inspector-top"><h2>${esc(c.name)}</h2><button id="closeInspector" autofocus>Close</button></div><div class="inspector-body">${c.cost!==undefined?cardHTML(c):`<img alt="${esc(c.name)} illustration" src="/art/${esc(key)}?v=anime-2">`}<div><div class="label">${esc(c.kind|| (key.startsWith('relic_')?'Relic':'Commander'))}</div>${c.cost!==undefined?'<p><b>Mana cost: '+manaCost(c)+'</b></p>':''}<p>${esc(c.text)}</p>${(c.keywords||[]).map(k=>`<p><b>${esc(k)}</b>: ${esc(state.battle?.keywords[k]||({Haste:'May attack and exhaust immediately.',Guard:'Attacking does not exhaust.',Flying:'Only Flying or Reach creatures can block.',Reach:'Can block Flying.',Trample:'Excess damage reaches the defender.',Lifesteal:'Damage dealt also heals you.',Ward:'Opposing targeting costs one extra generic mana.',Goad:'Must attack another opponent if able.'}[k]))}</p>`).join('')}${c.kind==='creature'?`<p><b>${c.attack} attack / ${c.health} maximum health</b></p>`:''}</div></div>`;
    dialog.querySelectorAll('.art-inspect').forEach(x=>x.remove());
    document.querySelector('#closeInspector').onclick=()=>dialog.close();
    if(!dialog.open)dialog.showModal();
}

function commanderPicker(){
    const m=state.me,key='tactical-picker:'+credentials.code+':'+m.id;
    const offerKey=m.offers.join(',');
    if(!commanderDraft||commanderDraft.key!==key||commanderDraft.offers!==offerKey){
        const saved=JSON.parse(sessionStorage.getItem(key)||'null');
        commanderDraft=saved?.offers===offerKey?saved:{key,offers:offerKey,commander:null,package:null};
    }
    if(m.commander){
        const c=commander(m.commander),p=c.packages[m.package];
        return `<h2>Commander confirmed</h2><div class="panel"><h3>${esc(c.name)}</h3><p>${c.colors.map(k=>colors[k]).join(' / ')} · ${esc(p.name)}</p><p>${esc(p.description)}</p><div class="notice">Waiting for the other players to finish their choices. You selected one commander and one package.</div></div>`;
    }
    const chosen=commanderDraft.commander&&m.offers.includes(commanderDraft.commander)?commander(commanderDraft.commander):null;
    const steps=`<nav class="picker-steps" aria-label="Commander selection"><span ${!chosen?'aria-current="step"':''}>1. Choose one commander</span><span ${chosen?'aria-current="step"':''}>2. Choose one package</span></nav>`;
    if(!chosen){
        return `${steps}<h2 id="pickerTitle" tabindex="-1">Step 1: choose ONE commander</h2><p class="muted">These are three alternatives. Select one, then choose its ability package on the next screen. Nothing is locked in yet.</p><div class="commander-options">${m.offers.map(id=>{const c=commander(id);return `<section class="panel commander-option ${c.colors[0]}"><img class="commander-portrait" role="button" tabindex="0" data-action="inspect:commander_${esc(c.id)}" alt="${esc(c.name)} portrait" src="/art/commander_${esc(c.id)}"><div class="commander-copy"><div class="label">Commander</div><h3>${esc(c.name)}</h3><p>${c.colors.map(k=>`<span class="mana ${k}">${colors[k]}</span>`).join(' ')}</p><p class="muted">Two ability packages available after selection.</p>${button('Choose this commander','pickCommander:'+id,false,'primary')}</div></section>`}).join('')}</div>`;
    }
    const packageChoice=Number.isInteger(commanderDraft.package)?chosen.packages[commanderDraft.package]:null;
    return `${steps}<h2 id="pickerTitle" tabindex="-1">Step 2: choose ONE package</h2><section class="panel chosen-commander"><img class="selected-portrait" alt="${esc(chosen.name)} portrait" src="/art/commander_${esc(chosen.id)}"><div><div class="label">Your selected commander</div><h3>${esc(chosen.name)}</h3><p>${chosen.colors.map(k=>colors[k]).join(' / ')} · These colors stay the same with either package.</p></div>${button('Back: change commander','backCommander')}</section><p class="muted">Choose one of these two alternatives. Each package includes both the passive and active abilities described below.</p><div class="package-options">${chosen.packages.map((p,j)=>`<section class="panel package-option ${commanderDraft.package===j?'chosen':''}"><div class="label">Package ${j+1} · passive + active</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><button data-action="pickPackage:${j}" aria-pressed="${commanderDraft.package===j}" class="${commanderDraft.package===j?'selected':''}">${commanderDraft.package===j?'Selected package':'Select this package'}</button></section>`).join('')}</div><section class="panel picker-confirm"><div><div class="label">Review your choice</div><b>${esc(chosen.name)}</b><p>${packageChoice?esc(packageChoice.name):'Select one package above to continue.'}</p><small class="muted">Confirmation locks this commander and package for the ${state.mode==='solo'?'run':'competition'}.</small></div>${button('Confirm commander & package','confirmCommander',!packageChoice||busy,'primary')}</section>`;
}

function updateCommanderDraft(changes){
    Object.assign(commanderDraft,changes);
    sessionStorage.setItem(commanderDraft.key,JSON.stringify(commanderDraft));
    render();
    document.querySelector('#pickerTitle')?.focus();
}
const colors={W:'White',U:'Blue',B:'Black',R:'Red',G:'Green',C:'Neutral'};
function error(message){const box=document.querySelector('#error');box.textContent=message;box.style.display='block';setTimeout(()=>box.style.display='none',6000)}
async function request(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),...(credentials?{Authorization:'Bearer '+credentials.token}:{})},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
async function act(action,data={}){if(busy)return;busy=true;try{await request('/api/action',{code:credentials.code,action,...data});if(action==='commander'&&commanderDraft){sessionStorage.removeItem(commanderDraft.key);commanderDraft=null}selected=null;signature='';await poll()}catch(e){error(e.message)}finally{busy=false}}
function seat(c){credentials=c;sessionStorage.setItem('tactical-seat',JSON.stringify(c));let list=JSON.parse(localStorage.getItem('tactical-rooms')||'[]');list=list.filter(x=>x.token!==c.token);list.unshift(c);localStorage.setItem('tactical-rooms',JSON.stringify(list.slice(0,12)));home=false;signature='';poll()}
function button(text,action,disabled=false,cls=''){return `<button ${disabled?'disabled':''} class="${cls}" data-action="${action}">${esc(text)}</button>`}
function welcome(){home=true;connection.textContent='';const rooms=JSON.parse(localStorage.getItem('tactical-rooms')||'[]');app.innerHTML=`<div class="welcome"><section class="welcome-hero"><div class="label">Build a threat. Read the table. Hold your response.</div><h2>Four seats. One survivor.</h2><p class="muted">Choose a commander, draft your strategy, and contest powerful combinations. Play a four-act solo campaign or invite friends to a private group.</p></section><div class="panel name-panel"><label>Your name <input id="name" value="Player" maxlength="32"></label></div><div class="grid mode-grid"><div class="panel mode-panel"><div class="mode-step">Play on your own</div><h3>Solo campaign</h3><p>Three encounters and a boss per act. Four acts, one retry, and a build that adapts between battles.</p>${button('Begin solo run','createSolo',false,'primary')}</div><div class="panel mode-panel"><div class="mode-step">Host your friends</div><h3>Human competition</h3><p>Pick and pass with your group. Score eliminations and survival; improve your deck between battles.</p><div class="row"><label>Seats <select id="size"><option>4</option><option>3</option><option>2</option></select></label><label>Point target <input id="target" type="number" min="1" max="50" value="5" style="width:75px"></label></div><p>${button('Create group','createHuman',false,'primary')}</p></div><div class="panel mode-panel"><div class="mode-step">Enter a room code</div><h3>Join friends</h3><p>Open this host’s address and enter their room code.</p><label>Room code <input id="code" placeholder="Enter code" maxlength="6"></label><p>${button('Join group','join')}</p></div></div>${rooms.length?`<div class="panel"><h3>Resume on this host</h3>${rooms.map((r,i)=>button(r.code,'resume:'+i)).join(' ')}</div>`:''}<details class="panel"><summary>Rules at a glance</summary><p>30-card deck, five-card hand, 25 health. Mana refreshes on your turn and grows to ten. Cards and responses share that mana. Creatures normally wait a turn to attack; blockers can defend immediately. Everyone gets priority before a pending action resolves.</p><p>The first cycle prevents elimination. Damage on creatures lasts until their controller’s turn. Relics are public and cannot be removed. Ready creatures can block; exhausted creatures cannot.</p></details></div>`}
function cardById(id){return state.cards.find(c=>c.id===id)}
function commander(id){return state.commanders.find(c=>c.id===id)}
function relic(id){return state.relics.find(c=>c.id===id)}
function manaCost(c){const count=Object.values(c.pips||{}).reduce((a,b)=>a+b,0),generic=Math.max(0,(c.cost||0)-count);return (generic||!count?manaPip('C',generic):'')+Object.entries(c.pips||{}).map(([k,n])=>Array.from({length:n},()=>manaPip(k)).join('')).join('')}

function scoreboard(){return `<div class="row">${state.members.map(m=>`<span>${esc(m.name)}${m.bot?' · AI':''}${m.departed?' · left':''} <b>${m.score} VP</b> · ${m.losses} losses</span>`).join('<span class="muted"> / </span>')}</div>`}
function render(){if(!state||home)return;connection.textContent=`Room ${credentials.code} · ${state.mode==='solo'?'Solo':'Group'} · ${state.stage}`;const m=state.me;
let html=state.save_error?`<div class="notice">${esc(state.save_error)}</div>`:'';if(m.bot)html+=`<div class="notice">AI temporarily controls your seat. ${button('Reclaim control','reclaim')}</div>`;
if(state.stage==='lobby'){html+=`<h2>Your play group</h2><div class="notice">Invite friends to this address with code <b>${credentials.code}</b>. Each browser has its own private seat.</div><div class="panel">${state.members.map(x=>`<p>${esc(x.name)} ${x.bot?'· AI rival':''}</p>`).join('')}<p>${state.members.filter(x=>!x.departed).length}/${state.size} seats</p>${button('Add AI rival','add_bot',m.id!==state.host||state.members.filter(x=>!x.departed).length>=state.size)} ${button('Choose commanders','start',m.id!==state.host,'primary')}</div>`}
else if(state.stage==='commanders'){html+=commanderPicker()}
else if(state.stage==='draft'){const solo=state.mode==='solo',pack=solo?m.reward:state.pack;html+=`<h2>${solo?'Build your opening pool':'Pick and pass'}</h2><p>${solo?`Pack ${m.solo_packs+1}/3 · keep ${m.reward_left} more`:`Pack ${state.draft_round}/3 · pick ${state.draft_pick}/15 · ${m.picked?'waiting for other picks':'choose one card'}`}</p><div class="cardgrid">${pack.map((id,j)=>cardHTML(cardById(id),m.picked||(solo&&!legal(id))?'':'pick:'+j,legal(id)?'<small>Fits your identity</small>':'<small>Outside your identity</small>')).join('')}</div>`}
else if(state.stage==='battle'){html+=battleHTML()}
else if(state.stage==='vote'){html+=`<h2>Target reached</h2><div class="panel">${scoreboard()}<p>${esc(state.vote_message)}</p>${state.vote_options.map(c=>button(c,'vote:'+c)).join(' ')}<p>${state.members.filter(x=>!x.departed).map(x=>esc(x.name)+': '+esc(state.votes[x.id]||'pending')).join(' · ')}</p>${button('Leave competition','leave')}</div>`}
else if(['build','retry'].includes(state.stage)){html+=buildHTML()}
else {let title={victory:'Campaign complete',defeat:'Run ended',complete:'Competition complete'}[state.stage]||state.stage;html+=`<h2>${title}</h2><div class="panel">${scoreboard()}<p>${esc(state.vote_message)}</p>${state.mode==='human'?`<p>Leaders: ${state.members.filter(m=>!m.departed&&m.score===Math.max(...state.members.filter(x=>!x.departed).map(x=>x.score))).map(m=>esc(m.name)).join(', ')}</p>`:''}<p>${button('Back to rooms','home')}</p></div>`}
app.innerHTML=html;if(state.battle&&state.stage==='battle'){const card=selected&&state.battle.players.flatMap(p=>[...p.board,...p.hand]).find(c=>c.uid===selected.uid);SpireFX.setTarget(card,selected)}else SpireFX.clear();
}
function legal(id){return commander(state.me.commander).colors.includes(cardById(id).color)||cardById(id).color==='C'}
function counts(list){const c={};for(const x of list)c[x]=(c[x]||0)+1;return c}
function buildHTML(){const m=state.me,deck=counts(m.deck),owned=counts(m.owned),reserve=Object.keys(owned).filter(id=>owned[id]> (deck[id]||0)&&legal(id));let html=`<h2>${state.stage==='retry'?'One more chance':'Fine-tune your build'}</h2><div class="panel">${scoreboard()}<p>${esc(commander(m.commander).name)} · ${esc(commander(m.commander).packages[m.package].name)} · ${m.deck.length}/30 cards</p>${state.mode==='solo'?`<p>Act ${state.encounter.act} · ${state.encounter.kind} ${state.encounter.battle}/4 · ${esc(state.encounter.description)} · Currency ${state.currency} · Retries ${state.retry}</p><details><summary>Upcoming rivals</summary>${state.upcoming.map(x=>`<p>${esc(commander(x.commander).name)} ? ${commander(x.commander).colors.join('/')} ? ${esc(commander(x.commander).packages[x.package].description)}<br>Relic: ${esc(relic(x.relic).name)} ? ${esc(relic(x.relic).text)}</p>`).join('')}</details>`:''}</div>`;
if(m.reward_left){html+=`<h3>Reward pack · keep ${m.reward_left} more</h3><div class="cardgrid">${m.reward.map((id,j)=>cardHTML(cardById(id),legal(id)?'pick:'+j:'',legal(id)?'':'<small>Outside your identity</small>')).join('')}</div>`}
if(m.relic_options.length){html+=`<h3>${m.relic?'Optional relic replacement':'Choose your relic'}</h3><div class="grid">${m.relic_options.map(id=>`<div class="panel relic-choice"><img class="relic-art" alt="${esc(relic(id).name)} illustration" src="/art/relic_${esc(id)}"><h3>${esc(relic(id).name)}</h3><p>${esc(relic(id).text)}</p>${button('Choose','relic:'+id)}</div>`).join('')}${m.relic?`<div class="panel relic-choice"><img class="relic-art" alt="${esc(relic(m.relic).name)} illustration" src="/art/relic_${esc(m.relic)}"><h3>${esc(relic(m.relic).name)}</h3><p>${esc(relic(m.relic).text)}</p>${button('Keep current relic','relic:'+m.relic)}</div>`:''}</div>`}
else if(m.relic){html+=`<p><img class="relic-thumb" alt="" src="/art/relic_${esc(m.relic)}">Relic: <b>${esc(relic(m.relic).name)}</b> · ${esc(relic(m.relic).text)}</p>`}
html+=`<div class="notice">${swap?'Choose a reserve card to replace '+esc(cardById(swap).name)+'.':'Click a deck card, then a reserve card to exchange it. Deck size stays 30.'} ${swap?button('Cancel exchange','cancelSwap'):''}</div><h3>Deck</h3><div class="cardgrid">${Object.keys(deck).map(id=>cardHTML(cardById(id),m.ready?'':'swapOut:'+id,`<small>${deck[id]} copies</small>`)).join('')}</div><h3>Reserve</h3><div class="cardgrid">${reserve.map(id=>cardHTML(cardById(id),swap?'swapIn:'+id:'',`<small>${owned[id]-(deck[id]||0)} available</small>`)).join('')||'<p class="muted">No legal reserve cards yet.</p>'}</div>`;
if(state.mode==='solo'&&state.stage==='build'&&state.shop.length){html+=`<h3>Shop · one currency per card or refresh</h3><div class="grid">${state.shop.map((id,j)=>cardHTML(cardById(id),'',button('Buy','buy:'+j,state.currency<1))).join('')}</div><p>${button('Refresh shop · 1','refresh',state.currency<1)}</p>`}
if(state.reports.length){const r=state.reports.at(-1);html+=`<details class="panel"><summary>Last battle ? ${Math.round(r.seconds/60)} minutes</summary><p>Turns: ${r.turns.join(' / ')} ? Spectator waits: ${r.spectator_seconds.map(s=>Math.round(s/60)+'m').join(' / ')}</p><label>What would you change next time?<input id="feedback" maxlength="500" value="${esc(state.feedback)}" style="width:100%;margin:10px 0"></label>${button('Save reflection','feedback')}</details>`;}html+=`<div class="panel row">${state.stage==='retry'?button('Use retry','retry',false,'primary')+' '+button('End run','end_run'):button(m.ready?'Waiting for group':'Begin next battle','ready',m.ready||!!m.reward_left||!!m.relic_options.length,'primary')}${state.mode==='human'?button('Leave competition','leave'):''}</div>`;return html;
}
function targetLabel(t){if(t.startsWith('p:'))return state.battle.players[Number(t.slice(2))].name;let stack=state.battle.stack.find(s=>s.uid===t);if(stack)return stack.name;for(const p of state.battle.players){for(const z of ['board','grave','engines']){const c=p[z].find(c=>c.uid===t);if(c)return p.name+' · '+c.name}}return t}
function abilityKind(c){if(c.commander)return commander(state.me.commander).packages[state.me.package].active;return ['mana','sacrifice'].includes(c.effect)?c.effect:null}
function battleHTML(){const b=state.battle,m=state.me,me=b.players[m.seat],myPriority=b.priority===m.seat&&!b.finished;let html=`<div class="row"><h2 style="margin-right:auto">${esc(b.players[b.active].name)} · ${esc(b.phase.replaceAll('_',' '))}</h2><span>${state.timer}s · bank ${m.time_bank}s</span>${button('Reclaim seat','reclaim',!m.bot)}</div>`;
if(b.opening_protection)html+='<div class="notice">Opening protection: nobody can be eliminated until everyone has completed their first turn.</div>';
if(state.mode==='solo')html+=`<p class="muted">Act ${b.encounter.act} · ${b.encounter.kind} · ${esc(b.encounter.description)}</p>`;
if(!me.alive)html+='<div class="notice">You are spectating. Hands remain private; the board and played actions are public.</div>';
if(b.loop)html+=`<div class="notice">${esc(b.players[b.loop.owner].name)} ? ${b.loop.remaining} declared repetitions remaining. Opponents retain every response window. ${b.loop.owner===m.seat?button('Stop loop','stop_loop'):''}</div>`;html+='<div class="split"><div><div class="players">';
for(const p of b.players){const mobileOpponent=matchMedia('(max-width:850px)').matches&&p.id!==m.seat,showArea=!mobileOpponent||selected?.targets.some(t=>t==='p:'+p.id||p.board.some(c=>c.uid===t));html+=`<section class="panel player ${p.id===m.seat?'own-player':''} ${p.id===b.active?'active':''} ${p.id===b.priority?'priority':''} ${p.alive?'':'dead'}" data-player="p:${p.id}"><details class="player-area" ${showArea?'open':''}><summary class="player-summary"><div class="row"><img class="player-portrait" alt="${esc(commander(p.commander).name)} portrait" src="/art/commander_${esc(p.commander)}"><h3>${esc(p.name)}</h3><b style="margin-left:auto">${p.hp} health</b></div></summary><div class="muted">${p.hand_count} in hand · ${p.deck_count} in deck · ${p.points} battle VP</div><p>${Object.entries(p.capacity).map(([k,n])=>`<span class="mana ${k}" title="Ready / capacity">${manaPip(k)} ${p.mana[k]||0}/${n}</span>`).join('')}${p.temporary?`+${p.temporary} temporary`:''}</p><small>${esc(commander(p.commander).name)} · ${esc(commander(p.commander).packages[p.package].name)} · command ${p.commander_zone} · tax +${p.tax}</small><p><img class="relic-thumb" alt="" src="/art/relic_${esc(p.relic)}"><span class="tag" title="${esc(relic(p.relic).text)}">${esc(relic(p.relic).name)}</span></p>${selected&&selected.targets.includes('p:'+p.id)?button('Target '+p.name,'target:p:'+p.id,false,'primary'):''}<div class="board">${p.board.map(c=>{const target=selected?.targets.includes(c.uid);let extra='';if(p.id===m.seat&&myPriority&&abilityKind(c)&&!c.tapped)extra+=button('Use ability','ability:'+c.uid,false,'smallbtn');if(p.id===m.seat&&myPriority&&c.effect==='sacrifice'&&!b.stack.length)extra+=button('Declare loop','loop:'+c.uid,false,'smallbtn');if(p.id===m.seat&&myPriority&&b.phase==='combat'&&!b.stack.length){extra+=`<select data-attack="${c.uid}"><option value="">Stay ready</option>${b.players.filter(x=>x.alive&&x.id!==p.id).map(x=>`<option value="${x.id}" ${attackChoices[c.uid]===x.id?'selected':''}>Attack ${esc(x.name)}</option>`).join('')}</select>`}if(p.id===m.seat&&myPriority&&b.phase==='blocks'&&!c.tapped){extra+=`<select data-block="${c.uid}"><option value="">Do not block</option>${b.attacks.filter(a=>a.defender===p.id).map(a=>`<option value="${a.uid}" ${blockChoices[c.uid]===a.uid?'selected':''}>Block ${esc(targetLabel(a.uid))}</option>`).join('')}</select>`}return cardHTML(c,target?'target:'+c.uid:'',extra,!!target)}).join('')}</div>${p.engines.length?'<h4>Engines</h4><div class="board">'+p.engines.map(c=>cardHTML(c,selected?.targets.includes(c.uid)?'target:'+c.uid:'')).join('')+'</div>':''}<details><summary>Graveyard · ${p.grave.length}</summary><div class="board">${p.grave.map(c=>cardHTML(c,selected?.targets.includes(c.uid)?'target:'+c.uid:'')).join('')}</div></details></details></section>`}
html+='</div>';
if(b.phase==='opening'){html+=`<div class="panel"><h3>Your opening hand</h3>${button('Free full-hand mulligan','mulligan',me.mulligan||me.kept)} ${button('Keep hand','keep',me.kept,'primary')}${me.kept?`<p>Choose starting mana after your mulligan. Choices reveal together.</p>${me.colors.map(c=>button(colors[c],'color:'+c,false,me.opening_color===c?'selected':'')).join(' ')}`:''}</div>`}
if(myPriority&&b.phase==='grow')html+=`<div class="panel"><h3>Allocate new mana capacity</h3>${me.colors.map(c=>button(colors[c],'color:'+c)).join(' ')}</div>`;
if(b.choice&&b.choice.owner===m.seat)html+='<div class="notice">Choose one hand card to discard before resolution continues.</div>';if(selected){html+=`<div class="notice"><b>${esc(selected.name)}</b> · choose ${selected.costChoice?'a cost card':'a target'} ${button('Cancel','cancel')}<div class="row">${selected.targets.map(t=>button(targetLabel(t),'target:'+t)).join(' ')}</div></div>`}
html+=`<section class="panel hand"><h3>Your hand</h3><div class="cardgrid">${me.hand.map(c=>cardHTML(c,b.choice?.owner===m.seat?'discardChoice:'+c.uid:'cast:'+c.uid)).join('')}</div>${me.commander_zone==='command'?`<p>${button('Cast commander · '+(4+me.tax)+' total mana','cast:commander',!myPriority)}</p>`:''}</section></div><aside class="sticky"><div class="panel decision-panel"><h3>${myPriority?(b.stack.length?'Your response':'Your priority'):'Waiting for '+esc(b.players[b.priority].name)}</h3>${button(b.stack.length?'Pass response':({main:'Go to combat',precombat:'Continue to combat',main2:'End turn',end:'Finish turn'})[b.phase]||'Continue','pass',!myPriority||!!b.choice||['opening','grow','blocks'].includes(b.phase)||(b.phase==='combat'&&!b.stack.length),'primary')}${myPriority&&b.phase==='combat'&&!b.stack.length?'<p>'+button('Declare attacks','attack',false,'primary')+'</p>':''}${myPriority&&b.phase==='blocks'?'<p>'+button('Confirm blockers','block',false,'primary')+'</p>':''}<p class="muted">Response windows pass automatically when you have no legal instant or ability.</p><p>${button('Concede','concede',!myPriority||!!b.stack.length||b.phase==='opening')}</p></div><div class="panel"><h3>Pending actions</h3><small class="muted">Top resolves first, after everyone passes.</small>${[...b.stack].reverse().map(s=>`<div class="stackitem" data-stack="${s.uid}" ${selected?.targets.includes(s.uid)?`data-action="target:${s.uid}"`:''}><b>${esc(s.name)}</b><br><small>${esc(b.players[s.owner].name)}${s.target?' → '+esc(targetLabel(s.target)):''}</small></div>`).join('')||'<p class="muted">Empty stack</p>'}</div>${b.attacks.length?`<div class="panel"><h3>Combat</h3>${b.attacks.map(a=>`<p>${esc(targetLabel(a.uid))} → ${esc(b.players[a.defender].name)}<br><small>Blockers: ${(b.blocks[a.uid]||[]).map(targetLabel).map(esc).join(', ')||'none'}</small>${myPriority&&m.seat===b.active&&b.phase==='damage_response'&&(b.blocks[a.uid]||[]).length>1?button('Rotate blocker order','order:'+a.uid,false,'smallbtn'):''}</p>`).join('')}</div>`:''}<details class="panel" open><summary>Public action log</summary><div class="log">${[...b.log].reverse().map(x=>'<div>'+esc(x)+'</div>').join('')}</div></details><details class="panel"><summary>Keyword reference</summary>${Object.entries(b.keywords).map(([k,v])=>`<p><b>${k}</b>: ${esc(v)}</p>`).join('')}</details></aside></div>`;return html;
}
function selectCast(uid){const b=state.battle,me=b.players[state.me.seat];let c;if(uid==='commander'){const cmd=commander(state.me.commander);c={uid,name:cmd.name}}else c=me.hand.find(c=>c.uid===uid);if(!c)return;if(c.id==='r_loot'){selected={uid,name:c.name,costChoice:true,targets:me.hand.filter(d=>d!==c).map(d=>d.uid),action:'cast',targetKind:c.target};render();return}if(c.target){selected={uid,name:c.name,targets:b.targets[c.target],action:'cast'};render()}else act('cast',{uid})}
function selectAbility(uid){const me=state.battle.players[state.me.seat],c=me.board.find(c=>c.uid===uid),effect=abilityKind(c),kind={damage:'any',buff:'friendly',protect:'friendly',bounce:'creature',recall:'grave'}[effect];if(kind){selected={uid,name:c.name,targets:state.battle.targets[kind],action:'ability'};render()}else if(effect==='sacrifice'||effect==='loot'){selected={uid,name:c.name,targets:effect==='sacrifice'?me.board.filter(d=>d!==c).map(d=>d.uid):me.hand.map(d=>d.uid),costChoice:true,action:'ability',costField:effect==='sacrifice'?'sacrifice':'discard'};render()}else act('ability',{uid})}
app.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const key=el.dataset.action,[action,...rest]=key.split(':'),arg=rest.join(':');try{
if(action==='inspect'){inspectArtwork(arg);return}if(action==='home'){welcome();return}if(action==='resume'){seat(JSON.parse(localStorage.getItem('tactical-rooms'))[Number(arg)]);return}
if(['createSolo','createHuman','join'].includes(action)){const name=document.querySelector('#name').value;const result=await request(action==='join'?'/api/join':'/api/create',action==='join'?{name,code:document.querySelector('#code').value}:{name,mode:action==='createSolo'?'solo':'human',size:Number(document.querySelector('#size').value),target:Number(document.querySelector('#target').value)});seat(result);return}
if(action==='feedback'){act('feedback',{text:document.querySelector('#feedback').value});return}if(action==='pickCommander'){updateCommanderDraft({commander:arg,package:null});return}if(action==='backCommander'){updateCommanderDraft({commander:null,package:null});return}if(action==='pickPackage'){updateCommanderDraft({package:Number(arg)});return}if(action==='confirmCommander'){if(commanderDraft&&Number.isInteger(commanderDraft.package))act('commander',{commander:commanderDraft.commander,package:commanderDraft.package});return}if(action==='cmd'){act('commander',{commander:rest[0],package:Number(rest[1])});return}if(action==='pick'){act('pick',{index:Number(arg)});return}if(action==='relic'){act('relic',{relic:arg});return}if(action==='vote'){act('vote',{choice:arg});return}if(action==='color'){act('color',{color:arg});return}if(action==='buy'){act('buy',{index:Number(arg)});return}
if(action==='swapOut'){swap=arg;render();return}if(action==='cancelSwap'){swap=null;render();return}if(action==='swapIn'){const deck=[...state.me.deck];deck[deck.indexOf(swap)]=arg;swap=null;act('deck',{deck});return}
if(action==='discardChoice'){act('choose_discard',{uid:arg});return}if(action==='loop'){const count=Number(prompt('How many repetitions? Each opponent still gets priority. You may stop at any time.','3'));if(count)act('loop',{uid:arg,count});return}if(action==='cast'){selectCast(arg);return}if(action==='ability'){selectAbility(arg);return}if(action==='cancel'){selected=null;render();return}if(action==='target'&&selected){const s=selected;if(s.costChoice)act(s.action,{uid:s.uid,[s.costField||'discard']:arg});else act(s.action,{uid:s.uid,target:arg});return}
if(action==='attack'){const attacks=Object.entries(attackChoices).filter(([uid,d])=>d!==null).map(([uid,defender])=>({uid,defender}));act('attack',{attacks});attackChoices={};return}if(action==='block'){let blocks={};for(const [uid,a] of Object.entries(blockChoices)){if(a)(blocks[a]??=[]).push(uid)}act('block',{blocks});blockChoices={};return}if(action==='order'){let order=[...state.battle.blocks[arg]];order.push(order.shift());act('order',{uid:arg,order});return}
if(action==='concede'&&!confirm('Concede this battle? No elimination point will be awarded.'))return;
act(action);
}catch(e){error(e.message)}});
app.addEventListener('change',event=>{if(event.target.dataset.attack)attackChoices[event.target.dataset.attack]=event.target.value===''?null:Number(event.target.value);if(event.target.dataset.block)blockChoices[event.target.dataset.block]=event.target.value;if(event.target.id==='auto')act('auto',{enabled:event.target.checked})});
app.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.dataset.action)event.target.click()});
document.querySelector('#homeButton').onclick=()=>{if(home&&credentials){home=false;signature='';poll()}else welcome()};
async function poll(){if(!credentials||home)return;try{SpireFX.capture(state?.battle);const next=await request('/api/state?code='+encodeURIComponent(credentials.code));const sig=JSON.stringify({...next,timer:0});state=next;const timer=document.querySelector('#timer');if(timer)timer.textContent=state.timer+'s ? bank '+state.me.time_bank+'s';if(sig!==signature){signature=sig;render();SpireFX.consume(state.battle)}}catch(e){connection.textContent='Connection interrupted · retrying';if(!state)error(e.message)}}
document.querySelector('#fx-reduced').checked=SpireFX.settings.reduced;if(credentials)poll();else welcome();setInterval(poll,750);
matchMedia('(max-width:850px)').addEventListener('change',()=>{if(state&&!home)render()});
</script></body></html>
